<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>维吉尼亚密码演示</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #00d9ff;
            margin-bottom: 30px;
            font-size: 2rem;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }

        /* 输入区域 */
        .input-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .input-group {
            flex: 1;
            min-width: 150px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #00d9ff;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-start {
            background: linear-gradient(135deg, #00d9ff, #0099cc);
            color: #000;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 217, 255, 0.4);
        }

        .btn-start:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-reset {
            background: rgba(255, 99, 71, 0.8);
            color: #fff;
        }

        .btn-reset:hover {
            background: rgba(255, 99, 71, 1);
        }

        /* 显示区域 */
        .display-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .char-display {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            align-items: center;
            min-height: 50px;
        }

        .char-display-label {
            width: 60px;
            color: #888;
            font-size: 14px;
        }

        .char-box {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            font-size: 20px;
            font-weight: bold;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .char-box.plaintext {
            background: rgba(0, 217, 255, 0.2);
            color: #00d9ff;
            border: 2px solid transparent;
        }

        .char-box.key {
            background: rgba(255, 99, 71, 0.2);
            color: #ff6347;
            border: 2px solid transparent;
        }

        .char-box.cipher {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            border: 2px solid transparent;
        }

        .char-box.active {
            transform: scale(1.2);
            border-color: currentColor;
            box-shadow: 0 0 15px currentColor;
        }

        .char-box.done {
            opacity: 0.4;
        }

        /* 表格区域 */
        .table-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
            overflow-x: auto;
        }

        .vigenere-table {
            border-collapse: collapse;
            margin: 0 auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .vigenere-table td {
            width: 22px;
            height: 22px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }

        .vigenere-table .header {
            background: rgba(255, 255, 255, 0.1);
            color: #aaa;
            font-weight: bold;
        }

        .vigenere-table .row-header {
            background: rgba(255, 99, 71, 0.1);
            color: #ff6347;
            font-weight: bold;
        }

        .vigenere-table .col-header {
            background: rgba(0, 217, 255, 0.1);
            color: #00d9ff;
            font-weight: bold;
        }

        .vigenere-table .highlight-row {
            background: rgba(255, 99, 71, 0.15) !important;
        }

        .vigenere-table .highlight-col {
            background: rgba(0, 217, 255, 0.15) !important;
        }

        .vigenere-table .intersection {
            background: linear-gradient(135deg, #ffd700, #ffaa00) !important;
            color: #000 !important;
            font-weight: bold;
            font-size: 14px;
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .vigenere-table .active-row-header {
            background: rgba(255, 99, 71, 0.4) !important;
            color: #fff !important;
        }

        .vigenere-table .active-col-header {
            background: rgba(0, 217, 255, 0.4) !important;
            color: #fff !important;
        }

        /* 说明区域 */
        .explanation {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            font-size: 16px;
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .explanation .step {
            color: #00d9ff;
            font-weight: bold;
        }

        .explanation .highlight-p {
            color: #00d9ff;
            font-weight: bold;
        }

        .explanation .highlight-k {
            color: #ff6347;
            font-weight: bold;
        }

        .explanation .highlight-c {
            color: #ffd700;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>维吉尼亚密码演示</h1>

        <div class="input-section">
            <div class="input-row">
                <div class="input-group">
                    <label>明文 (Plaintext)</label>
                    <input type="text" id="plaintext" value="HELLO" maxlength="12" placeholder="输入明文">
                </div>
                <div class="input-group">
                    <label>密钥 (Key)</label>
                    <input type="text" id="key" value="KEY" maxlength="10" placeholder="输入密钥">
                </div>
                <div class="btn-group">
                    <button class="btn-start" id="startBtn">开始加密</button>
                    <button class="btn-reset" id="resetBtn">重置</button>
                </div>
            </div>
        </div>

        <div class="display-section">
            <div class="char-display">
                <span class="char-display-label">明文:</span>
                <div id="plaintextDisplay"></div>
            </div>
            <div class="char-display">
                <span class="char-display-label">密钥:</span>
                <div id="keyDisplay"></div>
            </div>
            <div class="char-display">
                <span class="char-display-label">密文:</span>
                <div id="cipherDisplay"></div>
            </div>
        </div>

        <div class="table-section">
            <table class="vigenere-table" id="vigenereTable"></table>
        </div>

        <div class="explanation" id="explanation">
            点击「开始加密」查看维吉尼亚密码的加密过程
        </div>
    </div>

    <script>
        const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

        // DOM 元素
        const plaintextInput = document.getElementById('plaintext');
        const keyInput = document.getElementById('key');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const plaintextDisplay = document.getElementById('plaintextDisplay');
        const keyDisplay = document.getElementById('keyDisplay');
        const cipherDisplay = document.getElementById('cipherDisplay');
        const vigenereTable = document.getElementById('vigenereTable');
        const explanation = document.getElementById('explanation');

        let isAnimating = false;
        let animationStopped = false;

        // 初始化
        function init() {
            buildTable();
            updateDisplays();

            // 事件监听
            plaintextInput.addEventListener('input', handleInput);
            keyInput.addEventListener('input', handleInput);
            startBtn.addEventListener('click', startEncryption);
            resetBtn.addEventListener('click', reset);
        }

        // 处理输入
        function handleInput(e) {
            e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, '');
            if (!isAnimating) {
                updateDisplays();
            }
        }

        // 构建维吉尼亚表格
        function buildTable() {
            let html = '<tr><td class="header"></td>';

            // 列头
            for (let i = 0; i < 26; i++) {
                html += `<td class="header col-header" id="col-${i}">${ALPHABET[i]}</td>`;
            }
            html += '</tr>';

            // 表格内容
            for (let row = 0; row < 26; row++) {
                html += `<tr><td class="header row-header" id="row-${row}">${ALPHABET[row]}</td>`;
                for (let col = 0; col < 26; col++) {
                    const char = ALPHABET[(row + col) % 26];
                    html += `<td id="cell-${row}-${col}">${char}</td>`;
                }
                html += '</tr>';
            }

            vigenereTable.innerHTML = html;
        }

        // 更新字符显示
        function updateDisplays() {
            const plaintext = plaintextInput.value;
            const key = keyInput.value;

            // 清空显示
            plaintextDisplay.innerHTML = '';
            keyDisplay.innerHTML = '';
            cipherDisplay.innerHTML = '';

            if (!plaintext) return;

            // 显示明文
            for (let i = 0; i < plaintext.length; i++) {
                const box = document.createElement('div');
                box.className = 'char-box plaintext';
                box.id = `p-${i}`;
                box.textContent = plaintext[i];
                plaintextDisplay.appendChild(box);
            }

            // 显示密钥（循环）
            if (key) {
                for (let i = 0; i < plaintext.length; i++) {
                    const box = document.createElement('div');
                    box.className = 'char-box key';
                    box.id = `k-${i}`;
                    box.textContent = key[i % key.length];
                    keyDisplay.appendChild(box);
                }
            }
        }

        // 开始加密动画
        async function startEncryption() {
            const plaintext = plaintextInput.value;
            const key = keyInput.value;

            if (!plaintext || !key) {
                showExplanation('请输入明文和密钥！');
                return;
            }

            isAnimating = true;
            animationStopped = false;
            startBtn.disabled = true;
            plaintextInput.disabled = true;
            keyInput.disabled = true;

            // 清空密文显示
            cipherDisplay.innerHTML = '';

            for (let i = 0; i < plaintext.length; i++) {
                if (animationStopped) break;

                const pChar = plaintext[i];
                const kChar = key[i % key.length];
                const pIndex = ALPHABET.indexOf(pChar);
                const kIndex = ALPHABET.indexOf(kChar);
                const cIndex = (pIndex + kIndex) % 26;
                const cChar = ALPHABET[cIndex];

                // 步骤1: 高亮当前字符
                showExplanation(`<span class="step">第 ${i + 1} 步:</span> 明文 <span class="highlight-p">'${pChar}'</span> + 密钥 <span class="highlight-k">'${kChar}'</span>`);
                highlightCurrentChars(i);
                await delay(600);

                if (animationStopped) break;

                // 步骤2: 高亮表格行列
                showExplanation(`在表中找到: 行 <span class="highlight-k">'${kChar}'</span> 与 列 <span class="highlight-p">'${pChar}'</span> 的交点`);
                highlightTableRowCol(kIndex, pIndex);
                await delay(800);

                if (animationStopped) break;

                // 步骤3: 高亮交点
                showExplanation(`交点字符为: <span class="highlight-c">'${cChar}'</span>`);
                highlightIntersection(kIndex, pIndex);
                await delay(800);

                if (animationStopped) break;

                // 步骤4: 添加密文字符
                addCipherChar(i, cChar);
                await delay(400);

                // 清理高亮
                clearHighlights();
                markCharDone(i);
            }

            if (!animationStopped) {
                const cipher = encrypt(plaintext, key);
                showExplanation(`加密完成！密文: <span class="highlight-c">${cipher}</span>`);
            }

            isAnimating = false;
            startBtn.disabled = false;
            plaintextInput.disabled = false;
            keyInput.disabled = false;
        }

        // 加密函数
        function encrypt(plaintext, key) {
            let result = '';
            for (let i = 0; i < plaintext.length; i++) {
                const pIndex = ALPHABET.indexOf(plaintext[i]);
                const kIndex = ALPHABET.indexOf(key[i % key.length]);
                result += ALPHABET[(pIndex + kIndex) % 26];
            }
            return result;
        }

        // 高亮当前处理的字符
        function highlightCurrentChars(index) {
            const pBox = document.getElementById(`p-${index}`);
            const kBox = document.getElementById(`k-${index}`);
            if (pBox) pBox.classList.add('active');
            if (kBox) kBox.classList.add('active');
        }

        // 标记字符为已处理
        function markCharDone(index) {
            const pBox = document.getElementById(`p-${index}`);
            const kBox = document.getElementById(`k-${index}`);
            if (pBox) {
                pBox.classList.remove('active');
                pBox.classList.add('done');
            }
            if (kBox) {
                kBox.classList.remove('active');
                kBox.classList.add('done');
            }
        }

        // 高亮表格行列
        function highlightTableRowCol(rowIndex, colIndex) {
            // 高亮行头
            const rowHeader = document.getElementById(`row-${rowIndex}`);
            if (rowHeader) rowHeader.classList.add('active-row-header');

            // 高亮列头
            const colHeader = document.getElementById(`col-${colIndex}`);
            if (colHeader) colHeader.classList.add('active-col-header');

            // 高亮整行
            for (let c = 0; c < 26; c++) {
                const cell = document.getElementById(`cell-${rowIndex}-${c}`);
                if (cell) cell.classList.add('highlight-row');
            }

            // 高亮整列
            for (let r = 0; r < 26; r++) {
                const cell = document.getElementById(`cell-${r}-${colIndex}`);
                if (cell) cell.classList.add('highlight-col');
            }
        }

        // 高亮交点
        function highlightIntersection(rowIndex, colIndex) {
            const cell = document.getElementById(`cell-${rowIndex}-${colIndex}`);
            if (cell) cell.classList.add('intersection');
        }

        // 清除所有高亮
        function clearHighlights() {
            document.querySelectorAll('.highlight-row, .highlight-col, .intersection, .active-row-header, .active-col-header').forEach(el => {
                el.classList.remove('highlight-row', 'highlight-col', 'intersection', 'active-row-header', 'active-col-header');
            });
        }

        // 添加密文字符
        function addCipherChar(index, char) {
            const box = document.createElement('div');
            box.className = 'char-box cipher';
            box.textContent = char;
            box.style.opacity = '0';
            box.style.transform = 'scale(0.5)';
            cipherDisplay.appendChild(box);

            // 动画效果
            requestAnimationFrame(() => {
                box.style.transition = 'all 0.3s ease-out';
                box.style.opacity = '1';
                box.style.transform = 'scale(1)';
            });
        }

        // 显示说明
        function showExplanation(html) {
            explanation.innerHTML = html;
        }

        // 重置
        function reset() {
            animationStopped = true;
            isAnimating = false;
            startBtn.disabled = false;
            plaintextInput.disabled = false;
            keyInput.disabled = false;

            clearHighlights();
            updateDisplays();
            showExplanation('点击「开始加密」查看维吉尼亚密码的加密过程');
        }

        // 延迟函数
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 启动
        init();
    </script>
</body>
</html>
