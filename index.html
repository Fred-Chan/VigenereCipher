<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>维吉尼亚密码演示</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #00d9ff;
            margin-bottom: 24px;
            font-size: 1.8rem;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }

        /* 输入区域 */
        .input-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .input-group {
            flex: 1;
            min-width: 150px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #aaa;
            font-size: 13px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 14px;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #00d9ff;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn-auto {
            background: linear-gradient(135deg, #00d9ff, #0099cc);
            color: #000;
        }

        .btn-step {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: #fff;
        }

        .btn-auto:hover, .btn-step:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 217, 255, 0.3);
        }

        .btn-auto:disabled, .btn-step:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-reset {
            background: rgba(255, 99, 71, 0.8);
            color: #fff;
        }

        .btn-reset:hover {
            background: rgba(255, 99, 71, 1);
        }

        /* 显示区域 - 横向排列 */
        .display-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .char-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            min-height: 48px;
        }

        .char-row:last-child {
            margin-bottom: 0;
        }

        .char-row-label {
            width: 50px;
            color: #888;
            font-size: 13px;
            flex-shrink: 0;
        }

        .char-boxes {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .char-box {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .char-box.plaintext {
            background: rgba(0, 217, 255, 0.2);
            color: #00d9ff;
            border: 2px solid transparent;
        }

        .char-box.key {
            background: rgba(255, 99, 71, 0.2);
            color: #ff6347;
            border: 2px solid transparent;
        }

        .char-box.cipher {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            border: 2px solid transparent;
        }

        .char-box.active {
            transform: scale(1.15);
            border-color: currentColor;
            box-shadow: 0 0 12px currentColor;
        }

        .char-box.done {
            opacity: 0.4;
        }

        .char-box.placeholder {
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.2);
        }

        /* 表格区域 */
        .table-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .vigenere-table {
            border-collapse: collapse;
            margin: 0 auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .vigenere-table td {
            width: 26px;
            height: 26px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }

        .vigenere-table .header {
            background: rgba(255, 255, 255, 0.1);
            color: #aaa;
            font-weight: bold;
        }

        .vigenere-table .row-header {
            background: rgba(255, 99, 71, 0.1);
            color: #ff6347;
            font-weight: bold;
        }

        .vigenere-table .col-header {
            background: rgba(0, 217, 255, 0.1);
            color: #00d9ff;
            font-weight: bold;
        }

        .vigenere-table .highlight-row {
            background: rgba(255, 99, 71, 0.2) !important;
        }

        .vigenere-table .highlight-col {
            background: rgba(0, 217, 255, 0.2) !important;
        }

        .vigenere-table .intersection {
            background: linear-gradient(135deg, #ffd700, #ffaa00) !important;
            color: #000 !important;
            font-weight: bold;
            font-size: 16px;
            transform: scale(1.15);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .vigenere-table .active-row-header {
            background: rgba(255, 99, 71, 0.5) !important;
            color: #fff !important;
        }

        .vigenere-table .active-col-header {
            background: rgba(0, 217, 255, 0.5) !important;
            color: #fff !important;
        }

        /* 说明区域 */
        .explanation {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px 20px;
            text-align: center;
            font-size: 15px;
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .explanation .step {
            color: #00d9ff;
            font-weight: bold;
        }

        .explanation .highlight-p {
            color: #00d9ff;
            font-weight: bold;
        }

        .explanation .highlight-k {
            color: #ff6347;
            font-weight: bold;
        }

        .explanation .highlight-c {
            color: #ffd700;
            font-weight: bold;
        }

        /* 步进提示 */
        .step-hint {
            color: #9b59b6;
            font-size: 13px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>维吉尼亚密码演示</h1>

        <div class="input-section">
            <div class="input-row">
                <div class="input-group">
                    <label>明文 (Plaintext)</label>
                    <input type="text" id="plaintext" value="HELLO" maxlength="12" placeholder="输入明文">
                </div>
                <div class="input-group">
                    <label>密钥 (Key)</label>
                    <input type="text" id="key" value="KEY" maxlength="10" placeholder="输入密钥">
                </div>
                <div class="btn-group">
                    <button class="btn-auto" id="autoBtn">自动演示</button>
                    <button class="btn-step" id="stepBtn">单步执行</button>
                    <button class="btn-reset" id="resetBtn">重置</button>
                </div>
            </div>
        </div>

        <div class="display-section">
            <div class="char-row">
                <span class="char-row-label">明文:</span>
                <div class="char-boxes" id="plaintextDisplay"></div>
            </div>
            <div class="char-row">
                <span class="char-row-label">密钥:</span>
                <div class="char-boxes" id="keyDisplay"></div>
            </div>
            <div class="char-row">
                <span class="char-row-label">密文:</span>
                <div class="char-boxes" id="cipherDisplay"></div>
            </div>
        </div>

        <div class="table-section">
            <table class="vigenere-table" id="vigenereTable"></table>
        </div>

        <div class="explanation" id="explanation">
            点击「自动演示」查看完整加密过程，或点击「单步执行」逐步查看
        </div>
    </div>

    <script>
        const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

        // DOM 元素
        const plaintextInput = document.getElementById('plaintext');
        const keyInput = document.getElementById('key');
        const autoBtn = document.getElementById('autoBtn');
        const stepBtn = document.getElementById('stepBtn');
        const resetBtn = document.getElementById('resetBtn');
        const plaintextDisplay = document.getElementById('plaintextDisplay');
        const keyDisplay = document.getElementById('keyDisplay');
        const cipherDisplay = document.getElementById('cipherDisplay');
        const vigenereTable = document.getElementById('vigenereTable');
        const explanation = document.getElementById('explanation');

        let isAnimating = false;
        let animationStopped = false;
        let stepMode = false;
        let currentStep = 0;
        let currentSubStep = 0; // 0: 高亮字符, 1: 高亮行列, 2: 显示交点, 3: 添加密文
        let stepResolve = null;

        // 初始化
        function init() {
            buildTable();
            updateDisplays();

            // 事件监听
            plaintextInput.addEventListener('input', handleInput);
            keyInput.addEventListener('input', handleInput);
            autoBtn.addEventListener('click', () => startEncryption(false));
            stepBtn.addEventListener('click', handleStepClick);
            resetBtn.addEventListener('click', reset);
        }

        // 处理输入
        function handleInput(e) {
            e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, '');
            if (!isAnimating) {
                updateDisplays();
            }
        }

        // 构建维吉尼亚表格
        function buildTable() {
            let html = '<tr><td class="header"></td>';

            // 列头
            for (let i = 0; i < 26; i++) {
                html += `<td class="header col-header" id="col-${i}">${ALPHABET[i]}</td>`;
            }
            html += '</tr>';

            // 表格内容
            for (let row = 0; row < 26; row++) {
                html += `<tr><td class="header row-header" id="row-${row}">${ALPHABET[row]}</td>`;
                for (let col = 0; col < 26; col++) {
                    const char = ALPHABET[(row + col) % 26];
                    html += `<td id="cell-${row}-${col}">${char}</td>`;
                }
                html += '</tr>';
            }

            vigenereTable.innerHTML = html;
        }

        // 更新字符显示
        function updateDisplays() {
            const plaintext = plaintextInput.value;
            const key = keyInput.value;

            // 清空显示
            plaintextDisplay.innerHTML = '';
            keyDisplay.innerHTML = '';
            cipherDisplay.innerHTML = '';

            if (!plaintext) return;

            // 显示明文
            for (let i = 0; i < plaintext.length; i++) {
                const box = document.createElement('div');
                box.className = 'char-box plaintext';
                box.id = `p-${i}`;
                box.textContent = plaintext[i];
                plaintextDisplay.appendChild(box);
            }

            // 显示密钥（循环）
            if (key) {
                for (let i = 0; i < plaintext.length; i++) {
                    const box = document.createElement('div');
                    box.className = 'char-box key';
                    box.id = `k-${i}`;
                    box.textContent = key[i % key.length];
                    keyDisplay.appendChild(box);
                }
            }

            // 显示密文占位符
            for (let i = 0; i < plaintext.length; i++) {
                const box = document.createElement('div');
                box.className = 'char-box placeholder';
                box.id = `c-${i}`;
                box.textContent = '?';
                cipherDisplay.appendChild(box);
            }
        }

        // 处理单步点击
        function handleStepClick() {
            if (!isAnimating) {
                // 开始单步模式
                startEncryption(true);
            } else if (stepMode && stepResolve) {
                // 继续下一步
                stepResolve();
                stepResolve = null;
            }
        }

        // 开始加密动画
        async function startEncryption(isStepMode) {
            const plaintext = plaintextInput.value;
            const key = keyInput.value;

            if (!plaintext || !key) {
                showExplanation('请输入明文和密钥！');
                return;
            }

            isAnimating = true;
            animationStopped = false;
            stepMode = isStepMode;
            currentStep = 0;
            currentSubStep = 0;

            autoBtn.disabled = true;
            plaintextInput.disabled = true;
            keyInput.disabled = true;

            if (stepMode) {
                stepBtn.textContent = '下一步';
            } else {
                stepBtn.disabled = true;
            }

            // 重置显示
            updateDisplays();

            for (let i = 0; i < plaintext.length; i++) {
                if (animationStopped) break;
                currentStep = i;

                const pChar = plaintext[i];
                const kChar = key[i % key.length];
                const pIndex = ALPHABET.indexOf(pChar);
                const kIndex = ALPHABET.indexOf(kChar);
                const cIndex = (pIndex + kIndex) % 26;
                const cChar = ALPHABET[cIndex];

                // 子步骤1: 高亮当前字符
                currentSubStep = 0;
                showExplanation(`<span class="step">第 ${i + 1} 步:</span> 取明文 <span class="highlight-p">'${pChar}'</span> 和密钥 <span class="highlight-k">'${kChar}'</span>` +
                    (stepMode ? '<div class="step-hint">点击「下一步」继续</div>' : ''));
                highlightCurrentChars(i);
                await waitForNext(500);

                if (animationStopped) break;

                // 子步骤2: 高亮表格行列
                currentSubStep = 1;
                showExplanation(`在表中找到: 密钥行 <span class="highlight-k">'${kChar}'</span> 与明文列 <span class="highlight-p">'${pChar}'</span>` +
                    (stepMode ? '<div class="step-hint">点击「下一步」继续</div>' : ''));
                highlightTableRowCol(kIndex, pIndex);
                await waitForNext(600);

                if (animationStopped) break;

                // 子步骤3: 高亮交点
                currentSubStep = 2;
                showExplanation(`行列交点的字符为: <span class="highlight-c">'${cChar}'</span>` +
                    (stepMode ? '<div class="step-hint">点击「下一步」继续</div>' : ''));
                highlightIntersection(kIndex, pIndex);
                await waitForNext(600);

                if (animationStopped) break;

                // 子步骤4: 添加密文字符
                currentSubStep = 3;
                setCipherChar(i, cChar);
                await waitForNext(300);

                // 清理高亮，准备下一轮
                clearHighlights();
                markCharDone(i);
            }

            if (!animationStopped) {
                const cipher = encrypt(plaintext, key);
                showExplanation(`加密完成！密文: <span class="highlight-c">${cipher}</span>`);
            }

            isAnimating = false;
            stepMode = false;
            autoBtn.disabled = false;
            stepBtn.disabled = false;
            stepBtn.textContent = '单步执行';
            plaintextInput.disabled = false;
            keyInput.disabled = false;
        }

        // 等待下一步（自动模式延时，单步模式等待点击）
        function waitForNext(autoDelay) {
            if (stepMode) {
                return new Promise(resolve => {
                    stepResolve = resolve;
                });
            } else {
                return delay(autoDelay);
            }
        }

        // 加密函数
        function encrypt(plaintext, key) {
            let result = '';
            for (let i = 0; i < plaintext.length; i++) {
                const pIndex = ALPHABET.indexOf(plaintext[i]);
                const kIndex = ALPHABET.indexOf(key[i % key.length]);
                result += ALPHABET[(pIndex + kIndex) % 26];
            }
            return result;
        }

        // 高亮当前处理的字符
        function highlightCurrentChars(index) {
            const pBox = document.getElementById(`p-${index}`);
            const kBox = document.getElementById(`k-${index}`);
            if (pBox) pBox.classList.add('active');
            if (kBox) kBox.classList.add('active');
        }

        // 标记字符为已处理
        function markCharDone(index) {
            const pBox = document.getElementById(`p-${index}`);
            const kBox = document.getElementById(`k-${index}`);
            if (pBox) {
                pBox.classList.remove('active');
                pBox.classList.add('done');
            }
            if (kBox) {
                kBox.classList.remove('active');
                kBox.classList.add('done');
            }
        }

        // 高亮表格行列
        function highlightTableRowCol(rowIndex, colIndex) {
            // 高亮行头
            const rowHeader = document.getElementById(`row-${rowIndex}`);
            if (rowHeader) rowHeader.classList.add('active-row-header');

            // 高亮列头
            const colHeader = document.getElementById(`col-${colIndex}`);
            if (colHeader) colHeader.classList.add('active-col-header');

            // 高亮整行
            for (let c = 0; c < 26; c++) {
                const cell = document.getElementById(`cell-${rowIndex}-${c}`);
                if (cell) cell.classList.add('highlight-row');
            }

            // 高亮整列
            for (let r = 0; r < 26; r++) {
                const cell = document.getElementById(`cell-${r}-${colIndex}`);
                if (cell) cell.classList.add('highlight-col');
            }
        }

        // 高亮交点
        function highlightIntersection(rowIndex, colIndex) {
            const cell = document.getElementById(`cell-${rowIndex}-${colIndex}`);
            if (cell) cell.classList.add('intersection');
        }

        // 清除所有高亮
        function clearHighlights() {
            document.querySelectorAll('.highlight-row, .highlight-col, .intersection, .active-row-header, .active-col-header').forEach(el => {
                el.classList.remove('highlight-row', 'highlight-col', 'intersection', 'active-row-header', 'active-col-header');
            });
        }

        // 设置密文字符
        function setCipherChar(index, char) {
            const box = document.getElementById(`c-${index}`);
            if (box) {
                box.className = 'char-box cipher';
                box.textContent = char;
                box.style.transform = 'scale(1.2)';
                setTimeout(() => {
                    box.style.transform = 'scale(1)';
                }, 200);
            }
        }

        // 显示说明
        function showExplanation(html) {
            explanation.innerHTML = html;
        }

        // 重置
        function reset() {
            animationStopped = true;
            if (stepResolve) {
                stepResolve();
                stepResolve = null;
            }
            isAnimating = false;
            stepMode = false;
            currentStep = 0;
            currentSubStep = 0;

            autoBtn.disabled = false;
            stepBtn.disabled = false;
            stepBtn.textContent = '单步执行';
            plaintextInput.disabled = false;
            keyInput.disabled = false;

            clearHighlights();
            updateDisplays();
            showExplanation('点击「自动演示」查看完整加密过程，或点击「单步执行」逐步查看');
        }

        // 延迟函数
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 启动
        init();
    </script>
</body>
</html>
